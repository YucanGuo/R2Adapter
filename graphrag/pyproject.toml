[tool.poetry]
name = "graphrag"
version = "2.7.0"
description = "GraphRAG: A graph-based retrieval-augmented generation (RAG) system."
authors = ["Microsoft GraphRAG Team <graphrag@microsoft.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
environs = ">=11.0.0"
azure-search-documents = ">=11.5.2"
lancedb = ">=0.17.0"
aiofiles = ">=24.1.0"
fnllm = { version = ">=0.4.1", extras = ["azure", "openai"] }
json-repair = ">=0.30.3"
openai = ">=1.68.0"
nltk = "==3.9.1"
tiktoken = ">=0.11.0"
numpy = ">=1.25.2"
graspologic = ">=3.4.1"
networkx = ">=3.4.2"
pandas = ">=2.2.3"
pyarrow = ">=17.0.0"
umap-learn = ">=0.5.6"
pyyaml = ">=6.0.2"
python-dotenv = ">=1.0.1"
pydantic = ">=2.10.3"
devtools = ">=0.12.2"
typing-extensions = ">=4.12.2"
azure-cosmos = ">=4.9.0"
azure-identity = ">=1.19.0"
azure-storage-blob = ">=12.24.0"
future = ">=1.0.0"
typer = ">=0.16.0"
tqdm = ">=4.67.1"
textblob = ">=0.18.0.post0"
spacy = ">=3.8.4"
litellm = ">=1.77.1"

[tool.poetry.group.dev.dependencies]
poethepoet = ">=0.31.1"
coverage = ">=7.6.10"
ipykernel = ">=6.29.5"
jupyter = ">=1.1.1"
nbconvert = ">=7.16.4"
pyright = ">=1.1.391"
pytest = ">=8.3.4"
pytest-asyncio = ">=0.25.2"
pytest-timeout = ">=2.3.1"
ruff = ">=0.8.2"
# semversioner = ">=3.0.3"
# update-toml = ">=0.2.3"
deptry = ">=0.20.0"
mkdocs-material = ">=9.5.50"
mkdocs-jupyter = ">=0.25.1"
mkdocs-exclude-search = ">=0.6.5"
pytest-dotenv = ">=0.5.2"
# mkdocs-typer = ">=0.1.3"

[[tool.poetry.source]]
name = "sankuai"
url = "https://pip.sankuai.com/simple"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
graphrag = "graphrag.cli.main:app"

[tool.poe.tasks]
index = "python -m graphrag index --init --root ."
serve = "python -m graphrag serve"
eval = "python -m graphrag eval"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --disable-warnings"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["graphrag"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
